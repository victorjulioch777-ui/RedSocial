<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Crear cuenta - Nexio</title>

    <link rel="stylesheet" href="/public/css/global.css" />
    <link rel="stylesheet" href="/public/css/login.css" />
  </head>

  <body>
    <main class="login-page">
      <section class="login-card">
        <img
          class="brand-logo"
          src="/public/imagenes/logo-sin-fondo.png"
          alt="Nexio"
        />

        <p class="eyebrow">Red Social</p>

        <h1>Crear cuenta</h1>

        <form
          id="registerForm"
          class="login-form"
          action="/register"
          method="post"
        >
          <div>
            <label for="username"> Nombre de usuario </label>

            <input
              type="text"
              id="username"
              name="username"
              maxlength="80"
              required
            />
          </div>

          <div>
            <label for="password"> Contraseña </label>

            <input
              type="password"
              id="password"
              name="password"
              minlength="6"
              required
            />
          </div>

          <button type="submit">Crear cuenta</button>
        </form>

        <p>
          ¿Ya tienes una cuenta?
          <a href="/login"> Iniciar sesión </a>
        </p>
      </section>
    </main>
  </body>
</html>
